# Tomu nginx site config (source, pre-TLS).
#
# Install:  copy to /etc/nginx/sites-available/<host>, symlink into sites-enabled,
#           `nginx -t && systemctl reload nginx`, then `certbot --nginx -d <host>`
#           (certbot rewrites this into a 443 server + an HTTP->HTTPS redirect).
# Requires: the rate-limit zone in deploy/nginx/tomu-ratelimit.conf, included from http{}.
#
# Replace tomu.example.com and the root path with your own.
server {
    listen 80;
    listen [::]:80;
    server_name tomu.example.com;

    root /home/USER/tomu/packages/client/dist;
    index index.html;

    # Single-user hardening: block public signup, throttle login (brute-force).
    location = /api/v1/auth/register { return 404; }
    location = /api/v1/auth/login {
        limit_req zone=tomu_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3456;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (JWT-protected) -> Fastify on loopback
    location /api/ {
        proxy_pass http://127.0.0.1:3456;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP (StreamableHTTP, SSE) -> loopback; the MCP server enforces its own auth.
    location ~ ^/([A-Za-z0-9]+/)?mcp/?$ {
        proxy_pass http://127.0.0.1:3457;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OAuth 2.1 authorization-server endpoints -> MCP process (:3457):
    # metadata discovery, dynamic client registration, authorize/token/revoke, consent.
    location ^~ /.well-known/oauth {
        proxy_pass http://127.0.0.1:3457;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /authorize     { proxy_pass http://127.0.0.1:3457; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /token         { proxy_pass http://127.0.0.1:3457; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /register      { proxy_pass http://127.0.0.1:3457; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /revoke        { proxy_pass http://127.0.0.1:3457; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /oauth/consent { proxy_pass http://127.0.0.1:3457; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    # Field-capture photos. The API writes uploads/events/<event uuid>.jpg under
    # UPLOADS_DIR and hands out /uploads/<key> as fileUrl. An <img> tag cannot send
    # the JWT the client holds, so these are served unauthenticated and the uuid file
    # name is the capability: unguessable, but anyone with the URL can fetch it.
    # Only that exact shape is served — everything else under /uploads/ is 404, so
    # there is no directory listing and no other file is reachable. Widen the pattern
    # when scans start living here too.
    #
    # The regex must be quoted: unquoted { } are nginx block syntax, so a bare {36}
    # fails nginx -t with "pcre2_compile() failed: missing closing parenthesis".
    location ~* "^/uploads/(events/[0-9a-f-]{36}\.jpe?g)$" {
        alias /home/USER/tomu/uploads/$1;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        access_log off;
    }
    # Plain prefix, not ^~, so the regex above is still consulted first.
    location /uploads/ { return 404; }

    # SPA static + client-side routing
    location / { try_files $uri $uri/ /index.html; }
}
