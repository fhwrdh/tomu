name: CI

# Build + tests on every PR and branch push, so checks are visible before merge.
on:
  pull_request:
  push:
    branches-ignore: [main] # main is covered by the deploy workflow's gate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Server tests exercise the real routes against a real Postgres — drizzle
    # query building is most of what they do, so a mocked db would test the mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: filmlog
          POSTGRES_PASSWORD: filmlog
          POSTGRES_DB: filmlog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://filmlog:filmlog@localhost:5432/filmlog_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test (with coverage)
        run: npm run test:coverage
      - name: Build
        run: npm run build
